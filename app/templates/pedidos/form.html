{% extends "base.html" %}

{% block title %}{{ 'Editar' if pedido else 'Nuevo' }} pedido - TechBol{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4 mb-3">{{ 'Editar' if pedido else 'Nuevo' }} pedido</h1>
                <form method="post">
                    <div class="mb-3">
                        <label for="fecha" class="form-label">Fecha</label>
                        <input type="date" class="form-control" id="fecha" name="fecha" value="{{ pedido.fecha.strftime('%Y-%m-%d') if pedido else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="cliente_id" class="form-label">Cliente</label>
                        <select class="form-select" id="cliente_id" name="cliente_id" required>
                            <option value="">Seleccione un cliente</option>
                            {% for cliente in clientes %}
                                <option value="{{ cliente.id }}" {% if pedido and pedido.cliente_id == cliente.id %}selected{% endif %}>{{ cliente.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="producto_id" class="form-label">Producto</label>
                        <select class="form-select" id="producto_id" name="producto_id" required>
                            <option value="">Seleccione un producto</option>
                            {% for producto in productos %}
                                <option value="{{ producto.id }}" {% if pedido and pedido.producto_id == producto.id %}selected{% endif %}>{{ producto.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="monto" class="form-label">Monto</label>
                        <input type="number" class="form-control" id="monto" name="monto" min="0" step="0.01" value="{{ pedido.monto if pedido else '' }}" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a href="{{ url_for('pedidos.index') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
